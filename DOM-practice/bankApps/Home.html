<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <!-- daisy cdn -->
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"
            type="text/css" />
        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <!-- my style  -->
        <style>
            .container {
                padding:80px 20px 50px 20px;
            }
            
            hr{color:#f5f5f5;
            background-color:#f5f5f5
            padding:0px 0px;
            }

            .mockup-phone-display {

            max-height: 100vh; 
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            /* Firefox scrollbar */
            scrollbar-width: thin;
            scrollbar-color: purple;
            }

                /* Smooth toggle animation */

         </style>
    </head>
    <body>

        <div class="wrapper-conatainer h-screen flex justify-center">

            <div class="mockup-phone ">
                <div class="mockup-phone-camera "></div>
                <div
                    class="mockup-phone-display container  bg-white overflow-y-auto scroll-smooth">
                    <h1 class="text-red"> </h1>
                    <div class="div">
                        <div class="stat">
                            <hr>
                            <div class="text-[20px] font-bold"
                                id="account-ballance">100</div>
                            <div class="stat-desc">Available Balance</div>
                            <div class="ErrorMsgBox text-red-400 text-sm"
                                id="ErrorMsgBox"></div>
                            <div class="divider"></div>
                        </div>
                    </div>

                    <div class="row  flex justify-between px-[20px]">
                        <!-- add money toggle btn-->
                        <div
                            id="add-money-btn"
                            class="add-money-btn flex flex-col justify-center items-center text-center border-2 border-[#e8e2e1] rounded-xl p-4">
                            <img src="./images/wallet.png"
                                class="w-7 h-7 mb-2" alt="Add money" />
                            <a href="#" id="add-money-btn"
                                class="text-blue-600 text-[13px] font-medium">Add
                                Money</a>
                        </div>
                        <!-- cash out toggle btn -->
                        <div id="cash-out-btn"
                            class="add-money flex flex-col justify-center items-center text-center border-2 border-[#e8e2e1] rounded-xl p-4">
                            <img src="./images/withdraw.png"
                                class="w-7 h-7 mb-2" alt="Add money" />
                            <a href="#" id="cash-out-btn"
                                class="text-blue-600 text-[13px] font-medium">Cash
                                Out</a>
                        </div>

                        <div
                            class="add-money flex flex-col justify-center items-center text-center border-2 border-[#e8e2e1] rounded-xl p-4">
                            <img src="./images/wallet.png"
                                class="w-7 h-7 mb-2" alt="Add money" />
                            <a href="#"
                                class="text-blue-600 text-[13px] font-medium">Add
                                Money</a>
                        </div>
                    </div>

                    <!-- all form  -->

                    <!-- add money form input section -->
                    <div id="add-money-form"
                        class="px-[20px] mt-5 rounded-xl py-5 ">
                        <div
                            class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                            <div class="card-body">
                                <fieldset class="fieldset">
                                    <label class="label">Amount</label>
                                    <input type="text" class="input"
                                        placeholder="Amount of money"
                                        id="add-money-input" />
                                    <label class="Pin"></label>
                                    <input id="add-money-pin-number"
                                        type="password" class="input"
                                        placeholder="Pin Number"
                                        autoComplete="off" />

                                    <button id="add-money"
                                        class="btn btn-neutral mt-4">Add
                                        money</button>
                                </fieldset>
                            </div>
                        </div>
                    </div>

                    <!-- cash-out  input form  -->
                    <div id="cash-out-form"
                        class="px-[20px] rounded-xl mt-5 py-5 hidden">
                        <div
                            class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                            <div class="card-body">
                                <fieldset class="fieldset">
                                    <label class="label">Amount</label>
                                    <input type="text" class="input"
                                        placeholder="cash-out of money"
                                        id="cash-out-input" />
                                    <label class="Pin"></label>
                                    <input id="cash-out-pin-number"
                                        type="password" class="input"
                                        placeholder="Pin Number"
                                        autoComplete="off" />

                                    <button id="cash-out-btn"
                                        class="btn btn-neutral mt-4">cash-out</button>
                                </fieldset>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <script src="./js/addMoney.js"></script>
        <script src="./js/cashOut.js"></script>
        <script src="./js/feature.js"></script>

    </body>
</html>
